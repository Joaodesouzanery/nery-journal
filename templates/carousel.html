<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nery Journal — template de carrossel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;800&display=swap" />
<style>
  /* ===== Tokens (troque aqui; o Claude Design pode substituir tudo) ===== */
  :root {
    --bg: #0b0b0b;
    --fg: #ffffff;
    --muted: #b5b5b5;
    --accent: #ffc21a;          /* amarelo-capacete (Nery Obras) */
    --accent-ink: #0b0b0b;
    --line: rgba(255,255,255,.14);
    --font-head: "Barlow Condensed", "Oswald", "Arial Narrow", sans-serif;
    --font-body: "Inter", system-ui, sans-serif;
    --pad: 64px;
    --s: .45;                   /* escala da pré-visualização */
  }
  body[data-vertical="regula"] { --accent: #2ea3b5; --accent-ink: #ffffff; }

  * { box-sizing: border-box; }
  body { margin: 0; background: #1a1a1a; color: #eee; font-family: var(--font-body); }

  /* ===== Painel de controle (não aparece na exportação) ===== */
  .panel { position: sticky; top: 0; z-index: 10; background: #111; border-bottom: 1px solid #333;
           padding: 12px 16px; display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  .panel > label { flex: 1 1 420px; }
  .panel textarea { width: 100%; height: 140px; background: #000; color: #9f9; border: 1px solid #333;
                    font: 12px/1.4 ui-monospace, monospace; padding: 8px; }
  .panel label { font-size: 12px; color: #aaa; display: grid; gap: 4px; }
  .panel select, .panel button { background: #222; color: #fff; border: 1px solid #444; padding: 6px 10px; border-radius: 6px; }
  .panel .err { color: #f66; font-size: 12px; min-height: 16px; }
  body.clean .panel { display: none; }

  .deck { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; }
  .frame { width: calc(1080px * var(--s)); height: calc(1350px * var(--s)); position: relative; flex: none; }
  .slide { width: 1080px; height: 1350px; position: absolute; top: 0; left: 0; transform-origin: top left;
           transform: scale(var(--s)); background: var(--bg); color: var(--fg); overflow: hidden; }
  body.clean { --s: 1; background: #000; }
  body.clean .deck { padding: 0; gap: 0; }

  /* ===== Elementos fixos ===== */
  .wordmark { position: absolute; top: var(--pad); left: var(--pad); font: 800 56px/1 var(--font-body);
              letter-spacing: -.03em; text-transform: lowercase; display: inline-block; }
  .wordmark::after { content: ""; display: block; height: 8px; width: 34px; margin-top: 6px; background: var(--accent); }
  .counter { position: absolute; top: var(--pad); right: var(--pad); font: 600 28px/1 var(--font-body); color: var(--muted); }
  .tag { position: absolute; top: calc(var(--pad) + 76px); right: var(--pad); font: 800 24px/1 var(--font-body);
         letter-spacing: .12em; padding: 10px 16px; border: 3px solid var(--accent); color: var(--accent); }
  .label { font: 600 26px/1 var(--font-body); letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
  .headline { font: 800 92px/.95 var(--font-head); text-transform: uppercase; letter-spacing: -.005em; margin: 22px 0 0; }
  .source { font: 500 24px/1.3 var(--font-body); color: var(--muted); margin-top: 28px; }
  .foot { position: absolute; left: var(--pad); right: var(--pad); bottom: var(--pad); font: 500 22px/1.3 var(--font-body); color: var(--muted); }
  .foot .ai { opacity: .8; }

  /* ===== Tipos de slide ===== */
  .capa .photo { position: absolute; inset: 0; background: #151515 center/cover no-repeat; }
  .capa .photo.fallback { background-image:
      linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 54px 54px; background-color: #101418; }
  .capa .shade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 40%, rgba(0,0,0,.9) 100%); }
  .capa .block { position: absolute; left: var(--pad); right: var(--pad); bottom: 150px; }
  .capa .foot { bottom: 56px; }

  .inner { position: absolute; left: var(--pad); right: var(--pad); top: 220px; bottom: 160px; display: flex; flex-direction: column; justify-content: center; }
  .inner h2 { font: 800 96px/.95 var(--font-head); text-transform: uppercase; margin: 22px 0 36px; }
  .inner ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 28px; }
  .inner li { font: 500 40px/1.25 var(--font-body); padding-left: 44px; position: relative; }
  .inner li::before { content: ""; position: absolute; left: 0; top: 16px; width: 20px; height: 20px; background: var(--accent); }
  .big { font: 800 300px/.9 var(--font-head); color: var(--accent); margin: 10px 0 20px; letter-spacing: -.01em; }
  .caption { font: 600 46px/1.2 var(--font-body); }
  .statement { font: 800 108px/1 var(--font-head); text-transform: uppercase; }
  .srcs { margin: 20px 0 0; padding: 0; list-style: none; display: grid; gap: 14px; font: 500 30px/1.3 var(--font-body); }
  .srcs a { color: var(--fg); }
  .cta { margin-top: 44px; display: inline-block; background: var(--accent); color: var(--accent-ink); font: 800 38px/1 var(--font-body); padding: 26px 34px; }
</style>
</head>
<body data-vertical="obras">
<div class="panel" id="panel">
  <label>JSON do post (cole e clique em Aplicar)
    <textarea id="json" spellcheck="false"></textarea>
  </label>
  <div style="display:grid;gap:8px">
    <button id="apply">Aplicar</button>
    <label>Vertical
      <select id="vertical"><option value="obras">Obras (amarelo)</option><option value="regula">Regula (azul-petróleo)</option></select>
    </label>
    <label>Escala <select id="scale"><option>0.3</option><option selected>0.45</option><option>0.7</option><option>1</option></select></label>
    <button id="clean">Modo limpo (1080×1350)</button>
    <div class="err" id="err"></div>
  </div>
</div>
<div class="deck" id="deck"></div>

<script>
/* Dados de EXEMPLO. Nada aqui é notícia real: substitua por dados verificados. */
const SAMPLE = {
  marca: "nery journal",
  rotulo: "Exemplo",
  manchete: "Título de exemplo com até quatro linhas de texto",
  foto: { url: "", credito: "Foto: crédito do autor / banco", licenca: "ex.: Unsplash License", origem_url: "" },
  fonte_principal: "Fonte: nome da fonte primária (exemplo)",
  publi: { ativo: false, patrocinador: "" },
  correcao: false,
  aviso_ia: "Produzido com apoio de IA e revisado por editor.",
  slides: [
    { tipo: "capa" },
    { tipo: "fatos", titulo: "O que aconteceu", itens: ["Primeiro fato curto e verificável.", "Segundo fato, com número e data.", "Terceiro fato ou contexto."] },
    { tipo: "dado", numero: "00,0%", legenda: "Descrição do indicador e do período (exemplo)", fonte: "Fonte: órgão oficial (exemplo)" },
    { tipo: "impacto", titulo: "Por que importa para a obra", texto: "Uma frase prática sobre o efeito no custo, prazo ou contrato." },
    { tipo: "fonte", fontes: [{ nome: "Fonte primária (exemplo)", url: "exemplo.gov.br/pagina" }], cta: "Receba no WhatsApp" }
  ]
};

const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function safeUrl(u) { return /^(https?:)?\/\//.test(u) || /^[\w./-]+$/.test(u) ? u : ""; }

function chrome(slide, post, i, n) {
  slide.appendChild(el("div", "wordmark", post.marca || "nery journal"));
  slide.appendChild(el("div", "counter", (i + 1) + "/" + n));
  if (post.publi && post.publi.ativo) slide.appendChild(el("div", "tag", "PUBLI"));
  if (post.correcao) slide.appendChild(el("div", "tag", "CORREÇÃO"));
}

function foot(post, withCredit) {
  const f = el("div", "foot");
  if (withCredit && post.foto && post.foto.credito) f.appendChild(el("div", null, post.foto.credito));
  if (post.publi && post.publi.ativo && post.publi.patrocinador) f.appendChild(el("div", null, "Conteúdo patrocinado por " + post.publi.patrocinador));
  if (post.aviso_ia) f.appendChild(el("div", "ai", post.aviso_ia));
  return f;
}

function build(slideDef, post, i, n) {
  const s = el("div", "slide " + slideDef.tipo);
  switch (slideDef.tipo) {
    case "capa": {
      const ph = el("div", "photo");
      const u = post.foto && safeUrl(post.foto.url);
      if (u) ph.style.backgroundImage = 'url("' + u.replace(/"/g, "%22") + '")'; else ph.classList.add("fallback");
      s.appendChild(ph); s.appendChild(el("div", "shade"));
      chrome(s, post, i, n);
      const b = el("div", "block");
      b.appendChild(el("div", "label", post.rotulo));
      b.appendChild(el("h1", "headline", post.manchete));
      if (post.fonte_principal) b.appendChild(el("div", "source", post.fonte_principal));
      s.appendChild(b); s.appendChild(foot(post, true));
      break;
    }
    case "fatos": {
      chrome(s, post, i, n);
      const w = el("div", "inner");
      w.appendChild(el("div", "label", post.rotulo));
      w.appendChild(el("h2", null, slideDef.titulo || "O que aconteceu"));
      const ul = el("ul"); (slideDef.itens || []).forEach((t) => ul.appendChild(el("li", null, t)));
      w.appendChild(ul); s.appendChild(w); s.appendChild(foot(post, false));
      break;
    }
    case "dado": {
      chrome(s, post, i, n);
      const w = el("div", "inner");
      w.appendChild(el("div", "label", post.rotulo));
      w.appendChild(el("div", "big", slideDef.numero));
      w.appendChild(el("div", "caption", slideDef.legenda));
      if (slideDef.fonte) w.appendChild(el("div", "source", slideDef.fonte));
      s.appendChild(w); s.appendChild(foot(post, false));
      break;
    }
    case "impacto": {
      chrome(s, post, i, n);
      const w = el("div", "inner");
      w.appendChild(el("div", "label", slideDef.titulo || "Por que importa"));
      w.appendChild(el("div", "statement", slideDef.texto));
      s.appendChild(w); s.appendChild(foot(post, false));
      break;
    }
    case "fonte": {
      chrome(s, post, i, n);
      const w = el("div", "inner");
      w.appendChild(el("div", "label", "Fontes"));
      const ul = el("ul", "srcs");
      (slideDef.fontes || []).forEach((f) => { const li = el("li"); li.textContent = f.nome + (f.url ? " — " + f.url : ""); ul.appendChild(li); });
      w.appendChild(ul);
      if (slideDef.cta) w.appendChild(el("div", "cta", slideDef.cta));
      s.appendChild(w); s.appendChild(foot(post, false));
      break;
    }
    default: s.appendChild(el("div", "inner", "tipo de slide desconhecido: " + slideDef.tipo));
  }
  return s;
}

function render(post) {
  const deck = $("#deck"); deck.replaceChildren();
  const n = post.slides.length;
  post.slides.forEach((sd, i) => { const f = el("div", "frame"); f.appendChild(build(sd, post, i, n)); deck.appendChild(f); });
}

function apply() {
  try { const post = JSON.parse($("#json").value); if (!Array.isArray(post.slides)) throw new Error("slides[] ausente"); $("#err").textContent = ""; render(post); }
  catch (e) { $("#err").textContent = "JSON inválido: " + e.message; }
}

$("#json").value = JSON.stringify(SAMPLE, null, 2);
$("#apply").onclick = apply;
$("#vertical").onchange = (e) => { document.body.dataset.vertical = e.target.value; };
$("#scale").onchange = (e) => { document.documentElement.style.setProperty("--s", e.target.value); };
$("#clean").onclick = () => { document.body.classList.toggle("clean"); };
document.documentElement.style.setProperty("--s", "0.45");
apply();
</script>
</body>
</html>
