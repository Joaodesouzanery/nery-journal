name: nj-collect
# Coleta diária de dados abertos para a pauta (precisa dos Secrets SUPABASE_URL e SUPABASE_SERVICE_ROLE_KEY).
on:
  push:
    paths: ['.github/triggers/collect']  # dispara por push deste arquivo (a integração não consegue usar o botão Run)
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Id de um coletor (vazio = todos)'
        required: false
        default: ''
      dias:
        description: 'Licitações: dias para trás (padrão 2)'
        required: false
        default: '2'
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run nj:collect -- ${{ inputs.source }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - if: ${{ !cancelled() }}
        run: npm run nj:licitacoes -- ${{ inputs.dias }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - if: ${{ !cancelled() }}
        run: npm run nj:feeds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
