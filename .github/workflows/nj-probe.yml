name: nj-probe
# Testa os coletores contra as APIs reais. Não usa segredos e não grava nada.
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Id de um coletor (vazio = todos)'
        required: false
        default: ''
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run nj:probe -- ${{ inputs.source }}
