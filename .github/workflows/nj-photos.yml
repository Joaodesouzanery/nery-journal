name: nj-photos
# Liga fotos reais de licença livre (CC0/domínio público) às matérias publicadas sem foto.
on:
  push:
    paths: ['.github/triggers/photos']
  schedule:
    - cron: '40 10,15,21 * * *'   # 07:40, 12:40 e 18:40 (Brasília), depois de cada rodada de matérias
  workflow_dispatch:
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run nj:photos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
